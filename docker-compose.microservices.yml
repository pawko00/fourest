version: "3.8"

# Docker Compose for Microservices Architecture
# Use this for local development with microservices

services:
  postgres:
    image: postgres:15-alpine
    container_name: focusforest-db
    environment:
      POSTGRES_USER: focusforest
      POSTGRES_PASSWORD: focusforest123
      POSTGRES_DB: focusforest
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusforest"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - focusforest-network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: focusforest-auth-service
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: focusforest
      DB_PASSWORD: focusforest123
      DB_DATABASE: focusforest
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - focusforest-network

  session-service:
    build:
      context: ./services/session-service
      dockerfile: Dockerfile
    container_name: focusforest-session-service
    environment:
      NODE_ENV: development
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: focusforest
      DB_PASSWORD: focusforest123
      DB_DATABASE: focusforest
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      AUTH_SERVICE_URL: http://auth-service:3001
      CORS_ORIGIN: "*"
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - focusforest-network

  stats-service:
    build:
      context: ./services/stats-service
      dockerfile: Dockerfile
    container_name: focusforest-stats-service
    environment:
      NODE_ENV: development
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: focusforest
      DB_PASSWORD: focusforest123
      DB_DATABASE: focusforest
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      CORS_ORIGIN: "*"
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - focusforest-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: focusforest-frontend
    environment:
      VITE_API_AUTH_URL: http://localhost:3001
      VITE_API_SESSION_URL: http://localhost:3002
      VITE_API_STATS_URL: http://localhost:3003
    ports:
      - "5173:5173"
    depends_on:
      - auth-service
      - session-service
      - stats-service
    networks:
      - focusforest-network

networks:
  focusforest-network:
    driver: bridge

volumes:
  postgres-data:
