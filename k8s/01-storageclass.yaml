# StorageClass dla dynamicznego przydzielania zasobów dyskowych
# Używa domyślnego provisionera Minikube (hostpath)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fourest-storage
provisioner: k8s.io/minikube-hostpath
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
