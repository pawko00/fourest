# Kustomization dla łatwiejszego zarządzania manifestami
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fourest

resources:
  - 00-namespace.yaml
  - 01-storageclass.yaml
  - 02-configmap.yaml
  - 03-secret.yaml
  - 04-rbac.yaml
  - 05-postgres-pvc.yaml
  - 06-postgres-headless-service.yaml
  - 07-postgres-statefulset.yaml
  - 08-backend-deployment.yaml
  - 09-backend-service.yaml
  - 10-frontend-deployment.yaml
  - 11-frontend-service.yaml
  - 12-ingress.yaml

commonLabels:
  app: fourest
  managed-by: kustomize
