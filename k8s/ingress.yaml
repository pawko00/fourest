# Ingress Configuration for FocusForest
# Requires: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: focusforest-ingress
  namespace: focusforest
  labels:
    app: focusforest
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-connections: "5"
spec:
  ingressClassName: nginx
  rules:
    # Main domain routing
    - host: focusforest.local
      http:
        paths:
          # Frontend - default route
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

          # Auth Service API
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3001

          # Session Service API
          - path: /api/sessions
            pathType: Prefix
            backend:
              service:
                name: session-service
                port:
                  number: 3002

          # Stats Service API
          - path: /api/stats
            pathType: Prefix
            backend:
              service:
                name: stats-service
                port:
                  number: 3003

          # User routes go to auth-service
          - path: /api/user
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3001
