# Session Service Kubernetes Deployment
apiVersion: v1
kind: ConfigMap
metadata:
  name: session-service-config
  namespace: focusforest
data:
  NODE_ENV: production
  PORT: "3002"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USERNAME: focusforest
  DB_DATABASE: focusforest
  AUTH_SERVICE_URL: http://auth-service:3001
  CORS_ORIGIN: "*"
---
apiVersion: v1
kind: Secret
metadata:
  name: session-service-secret
  namespace: focusforest
type: Opaque
stringData:
  DB_PASSWORD: focusforest123
  JWT_SECRET: your-super-secret-jwt-key-change-in-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-service
  namespace: focusforest
  labels:
    app: session-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session-service
  template:
    metadata:
      labels:
        app: session-service
    spec:
      serviceAccountName: session-service-sa
      containers:
        - name: session-service
          image: focusforest-session-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: session-service-config
            - secretRef:
                name: session-service-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: session-service
  namespace: focusforest
spec:
  selector:
    app: session-service
  ports:
    - port: 3002
      targetPort: 3002
  type: ClusterIP
