# PersistentVolumeClaim dla bazy danych PostgreSQL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: fourest
  labels:
    app: fourest
    component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fourest-storage
  resources:
    requests:
      storage: 5Gi
