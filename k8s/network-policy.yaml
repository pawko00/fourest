# Network Policies for FocusForest
# Implements network isolation between services

# ===========================================
# DEFAULT DENY ALL - Security baseline
# ===========================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: focusforest
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# ===========================================
# POSTGRES - Only accessible by backend services
# ===========================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-network-policy
  namespace: focusforest
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from auth-service
    - from:
        - podSelector:
            matchLabels:
              app: auth-service
      ports:
        - protocol: TCP
          port: 5432
    # Allow from session-service
    - from:
        - podSelector:
            matchLabels:
              app: session-service
      ports:
        - protocol: TCP
          port: 5432
    # Allow from stats-service
    - from:
        - podSelector:
            matchLabels:
              app: stats-service
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # Allow DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53

---
# ===========================================
# AUTH SERVICE - Can access postgres, exposed via ingress
# ===========================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-service-network-policy
  namespace: focusforest
spec:
  podSelector:
    matchLabels:
      app: auth-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3001
    # Allow from other services (for internal communication)
    - from:
        - podSelector:
            matchLabels:
              app: session-service
        - podSelector:
            matchLabels:
              app: stats-service
      ports:
        - protocol: TCP
          port: 3001
  egress:
    # Allow to postgres
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53

---
# ===========================================
# SESSION SERVICE - Can access postgres and auth-service
# ===========================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: session-service-network-policy
  namespace: focusforest
spec:
  podSelector:
    matchLabels:
      app: session-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3002
  egress:
    # Allow to postgres
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow to auth-service (for token validation)
    - to:
        - podSelector:
            matchLabels:
              app: auth-service
      ports:
        - protocol: TCP
          port: 3001
    # Allow DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53

---
# ===========================================
# STATS SERVICE - Can access postgres and auth-service
# ===========================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stats-service-network-policy
  namespace: focusforest
spec:
  podSelector:
    matchLabels:
      app: stats-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3003
  egress:
    # Allow to postgres
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow to auth-service (for token validation)
    - to:
        - podSelector:
            matchLabels:
              app: auth-service
      ports:
        - protocol: TCP
          port: 3001
    # Allow DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53

---
# ===========================================
# FRONTEND - Only ingress traffic allowed
# ===========================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-network-policy
  namespace: focusforest
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
  egress:
    # Frontend doesn't need egress (static files served)
    # Allow DNS only
    - to: []
      ports:
        - protocol: UDP
          port: 53
