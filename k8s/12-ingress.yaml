# Ingress - centralny punkt wejścia z routingiem opartym na ścieżkach
# Wymaga włączenia ingress w MicroK8s: microk8s enable ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fourest-ingress-api
  namespace: fourest
  labels:
    app: fourest
  annotations:
    # Adnotacje dla NGINX Ingress Controller - rewrite dla API
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Backend API - /api/* -> backend:3000/*
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  number: 3000

---
# Osobny Ingress dla frontendu (bez rewrite)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fourest-ingress-frontend
  namespace: fourest
  labels:
    app: fourest
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Frontend - /* -> frontend:80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
