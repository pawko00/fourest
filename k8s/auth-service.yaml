# Auth Service Kubernetes Deployment
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: focusforest
data:
  NODE_ENV: production
  PORT: "3001"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USERNAME: focusforest
  DB_DATABASE: focusforest
  JWT_EXPIRES_IN: 7d
  CORS_ORIGIN: "*"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: focusforest
type: Opaque
stringData:
  DB_PASSWORD: focusforest123
  JWT_SECRET: your-super-secret-jwt-key-change-in-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: focusforest
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      serviceAccountName: auth-service-sa
      containers:
        - name: auth-service
          image: focusforest-auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: focusforest
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
