apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: focusforest
data:
  VITE_API_URL: http://backend:3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: focusforest
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: frontend-sa
      containers:
        - name: frontend
          image: focusforest-frontend:latest
          imagePullPolicy: Never # For local development
          ports:
            - containerPort: 5173
          envFrom:
            - configMapRef:
                name: frontend-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: focusforest
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
