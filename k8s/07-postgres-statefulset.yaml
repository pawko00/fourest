# StatefulSet dla PostgreSQL - trwała tożsamość sieciowa i stabilne przechowywanie danych
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fourest
  labels:
    app: fourest
    component: database
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: fourest
      component: database
  template:
    metadata:
      labels:
        app: fourest
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fourest-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fourest-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: fourest-secrets
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          # Limity i żądania zasobów
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          # Health checks
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - focusforest
                - -d
                - focusforest
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - focusforest
                - -d
                - focusforest
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  # VolumeClaimTemplates dla StatefulSet
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app: fourest
          component: database
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fourest-storage
        resources:
          requests:
            storage: 5Gi
