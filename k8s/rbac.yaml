# RBAC Configuration for FocusForest

# ===========================================
# SERVICE ACCOUNTS
# ===========================================

# Auth Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service-sa
  namespace: focusforest
  labels:
    app: auth-service
---
# Session Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: session-service-sa
  namespace: focusforest
  labels:
    app: session-service
---
# Stats Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stats-service-sa
  namespace: focusforest
  labels:
    app: stats-service
---
# Frontend Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: focusforest
  labels:
    app: frontend
---
# Postgres Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-sa
  namespace: focusforest
  labels:
    app: postgres

---
# ===========================================
# ROLES
# ===========================================

# Role for backend services - can read ConfigMaps and Secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-service-role
  namespace: focusforest
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]

---
# Role for frontend - minimal permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frontend-role
  namespace: focusforest
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]

---
# Role for database - can manage PVCs
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-role
  namespace: focusforest
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

---
# ===========================================
# ROLE BINDINGS
# ===========================================

# Auth Service Role Binding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-service-rolebinding
  namespace: focusforest
subjects:
  - kind: ServiceAccount
    name: auth-service-sa
    namespace: focusforest
roleRef:
  kind: Role
  name: backend-service-role
  apiGroup: rbac.authorization.k8s.io

---
# Session Service Role Binding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: session-service-rolebinding
  namespace: focusforest
subjects:
  - kind: ServiceAccount
    name: session-service-sa
    namespace: focusforest
roleRef:
  kind: Role
  name: backend-service-role
  apiGroup: rbac.authorization.k8s.io

---
# Stats Service Role Binding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stats-service-rolebinding
  namespace: focusforest
subjects:
  - kind: ServiceAccount
    name: stats-service-sa
    namespace: focusforest
roleRef:
  kind: Role
  name: backend-service-role
  apiGroup: rbac.authorization.k8s.io

---
# Frontend Role Binding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-rolebinding
  namespace: focusforest
subjects:
  - kind: ServiceAccount
    name: frontend-sa
    namespace: focusforest
roleRef:
  kind: Role
  name: frontend-role
  apiGroup: rbac.authorization.k8s.io

---
# Postgres Role Binding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-rolebinding
  namespace: focusforest
subjects:
  - kind: ServiceAccount
    name: postgres-sa
    namespace: focusforest
roleRef:
  kind: Role
  name: postgres-role
  apiGroup: rbac.authorization.k8s.io
